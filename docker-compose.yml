services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: docubot
      POSTGRES_PASSWORD: docubot
      POSTGRES_DB: docubot
    ports:
      - "5432:5432"
    volumes:
      - docubot_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docubot -d docubot"]
      interval: 2s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://docubot:docubot@db:5432/docubot
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  docubot_data:
